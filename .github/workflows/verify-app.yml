name: Verify Numwan V1 App

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "proxy.ts"
      - "tsconfig.json"
      - "next.config.ts"
      - ".github/workflows/verify-app.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Export lockfile for verification
        run: echo "LOCKFILE_BASE64=$(base64 -w0 package-lock.json)"
      - name: Install exact dependency tree
        run: npm ci
      - name: Build
        run: npm run build
