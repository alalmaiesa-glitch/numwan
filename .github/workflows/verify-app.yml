name: Verify Numwan V1 App

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "proxy.ts"
      - "tsconfig.json"
      - "next.config.ts"
      - ".github/workflows/verify-app.yml"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependency tree
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit lockfile if changed
        if: success() && github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock verified frontend dependencies"
            git push
          fi
